<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFCF40">
  <meta name="description" content="Libero — Pogledajte nas meni. Brza hrana i jela po vasem ukusu.">

  <!-- Open Graph -->
  <meta property="og:title" content="Libero — Meni">
  <meta property="og:description" content="Pogledajte nas meni. Brza hrana i jela po vasem ukusu.">
  <meta property="og:type" content="website">

  <title>Libero — Meni</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>

  <!-- App -->
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Offline Badge -->
  <div id="offline-badge" class="offline-badge" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <span>Offline — prikazuju se kesiran podaci</span>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header__brand">
      <img src="assets/images/LogoLibero.svg" alt="Libero" class="header__logo" width="120" height="50">
    </div>
    <button class="header__search-toggle" id="search-toggle" aria-label="Pretrazi meni">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </header>

  <!-- Search Bar -->
  <div class="search-container" id="search-container" hidden>
    <div class="search-bar">
      <svg class="search-bar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        id="search-input"
        class="search-bar__input"
        placeholder="Pretrazi jela ili sastojke..."
        autocomplete="off"
        aria-label="Pretrazi meni"
      >
      <button class="search-bar__clear" id="search-clear" hidden aria-label="Obrisi pretragu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Sort Controls -->
  <div class="sort-bar">
    <button class="sort-btn sort-btn--active" data-sort="recommended">Preporuceno</button>
    <button class="sort-btn" data-sort="price-asc">Cena ↑</button>
    <button class="sort-btn" data-sort="price-desc">Cena ↓</button>
  </div>

  <!-- Menu Content -->
  <main id="menu-container" class="menu-container">

    <!-- Skeleton Loading (visible before JS loads) -->
    <div class="skeleton-section" id="skeleton-loader">
      <div class="skeleton-header"></div>
      <div class="skeleton-card">
        <div class="skeleton-image"></div>
        <div class="skeleton-text">
          <div class="skeleton-line skeleton-line--title"></div>
          <div class="skeleton-line skeleton-line--desc"></div>
          <div class="skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-price"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-image"></div>
        <div class="skeleton-text">
          <div class="skeleton-line skeleton-line--title"></div>
          <div class="skeleton-line skeleton-line--desc"></div>
          <div class="skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-price"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-image"></div>
        <div class="skeleton-text">
          <div class="skeleton-line skeleton-line--title"></div>
          <div class="skeleton-line skeleton-line--desc"></div>
          <div class="skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-price"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-image"></div>
        <div class="skeleton-text">
          <div class="skeleton-line skeleton-line--title"></div>
          <div class="skeleton-line skeleton-line--desc"></div>
          <div class="skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-price"></div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__text">&copy; 2026 Libero. Sva prava zadrzana.</p>
    </div>
  </footer>

</body>
</html>
